name: Generate Language Stats
permissions:
  contents: write
on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/top-langs.mjs"
      - ".github/workflows/stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate top languages card
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: add a classic PAT with `repo` scope as STATS_TOKEN to include private repos
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node .github/scripts/top-langs.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/top-langs.svg output/top-langs-dark.svg
          if [ -n "$(git status --porcelain output)" ]; then
            git commit -m "chore: update language stats"
            git pull --rebase
            git push
          fi
